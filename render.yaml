# Render Blueprint Configuration (CI/CD Automated Infrastructure)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hostel-final-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash startup.sh
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: APP_ENV
        value: "production"

databases:
  - name: hostel-db
    databaseName: hostel_final_db
    user: hostel_admin
    region: oregon
    plan: free