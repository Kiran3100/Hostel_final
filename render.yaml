# Render Blueprint Configuration (CI/CD Automated Infrastructure)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hostel-final-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash startup.sh
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: APP_ENV
        value: "production"
      - key: SEED_DATA
        value: "false"
      - key: EMAIL_PROVIDER
        value: "brevo"
      - key: BREVO_SENDER_EMAIL
        value: "hemantpawade04@gmail.com"
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        value: "rzp_live_T1totnHl5LEoTG"
      - key: RAZORPAY_KEY_SECRET
        value: "cWjz2stqI2MsZ3LPQydlZh6F"
      - key: RAZORPAY_WEBHOOK_SECRET
        value: "cWjz2stqI2MsZ3LPQydlZh6F"
      - key: TWO_FACTOR_API_KEY
        sync: false

databases:
  - name: hostel-db
    databaseName: hostel_final_db
    user: hostel_admin
    region: oregon
    plan: free